org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Tamanho / performance do APK ---
# R8 no modo completo: menor dex possivel (padrao do AGP 8, mantido explicito).
android.enableR8.fullMode=true
# Nao embute informacao de Git dentro do APK.
android.enableVcsInfo=false
